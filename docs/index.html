:root{

  --c-btn:#ffc200; --c-btn-fg:#111111; --c-sel:#5d8dff; --c-danger:#ff6b5d; --c-ok:#4fc483; color-scheme:dark}}
:root[data-theme="dark"]{
  --c-bg:#111113; --c-panel:#1b1b1e; --c-fg:#ecebe8; --c-muted:#9d9c98; --c-line:#2f2f34; --c-soft:#242428;
  --c-btn:#ffc200; --c-btn-fg:#111111; --c-sel:#5d8dff; --c-danger:#ff6b5d; --c-ok:#4fc483; color-scheme:dark}

@font-face{font-family:'Pretendard';font-weight:400;font-display:swap;src:url(fonts/Pretendard-Regular.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:500;font-display:swap;src:url(fonts/Pretendard-Medium.woff2) format('woff2')}

html,body{height:100%}
body{background:var(--c-bg);color:var(--c-fg);font:14px/1.5 var(--f-ui)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;min-height:0}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid #f0dc96}

.panel{background:var(--c-panel);border-left:1px solid var(--c-line);overflow:auto;min-width:0;padding:18px 18px 40px}

.items{list-style:none;margin:0;padding:0;border:1px solid var(--c-line);border-radius:10px;overflow:hidden}
.items li{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 10px;font-size:13px}
.items li+li{border-top:1px solid var(--c-line)}
.items li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.items li button{border:0;background:transparent;width:26px;height:26px;border-radius:6px;color:var(--c-muted)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.typebtn{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--c-line);background:var(--c-panel);border-radius:12px;padding:10px 12px}
.typebtn:hover{border-color:var(--c-sel)}

.thumb{width:46px;height:34px;border-radius:6px;flex:none;border:1px solid rgba(0,0,0,.15);position:relative;overflow:hidden;background:#fff}
.thumb.dark{background:#000}
.thumb::before,.thumb::after{content:"";position:absolute;background:#c9c7c0;border-radius:2px}

.th-table::before{left:5px;top:8px;width:36px;height:2px;background:#111!important;box-shadow:0 6px 0 #c9c7c0,0 12px 0 #c9c7c0,0 18px 0 #111}

.th-text::before{left:12px;top:8px;width:22px;height:3px;background:#111!important}.th-text::after{left:7px;top:16px;width:32px;height:9px}
.th-photo::before{left:5px;top:7px;width:17px;height:20px}.th-photo::after{right:5px;top:7px;width:17px;height:20px}
.th-apply::before{left:13px;top:9px;width:20px;height:4px;background:#ffc200!important}.th-apply::after{left:9px;top:18px;width:28px;height:7px;background:#777!important}
.th-spacer::before{left:8px;top:16px;width:30px;height:0;border-top:1.5px dashed #999;background:transparent!important}
.th-grid::before{left:5px;top:6px;width:33px;height:19px;border:1.5px solid #111;border-radius:0;
  background:linear-gradient(#111,#111) 0 50%/100% 1.5px no-repeat,linear-gradient(#111,#111) 30% 0/1.5px 100% no-repeat,linear-gradient(#111,#111) 72% 0/1.5px 100% no-repeat,#fff!important}
.th-grid::after{display:none}
.th-steps::before{left:6px;top:16px;width:34px;height:1.5px;background:#111!important}
.th-steps::after{left:3px;top:10px;width:40px;height:13px;border-radius:0;
  background:radial-gradient(circle at 6px 6.5px,#fff 4px,#111 4.3px 5.6px,transparent 5.9px),radial-gradient(circle at 20px 6.5px,#fff 4px,#111 4.3px 5.6px,transparent 5.9px),radial-gradient(circle at 34px 6.5px,#fff 4px,#111 4.3px 5.6px,transparent 5.9px)!important}
.csw-none{background:linear-gradient(135deg,transparent 44%,#cf3426 44% 56%,transparent 56%),#fff!important}

.modal{position:fixed;inset:0;background:rgba(10,10,12,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;
  padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.mcard{background:var(--c-panel);border-radius:16px;width:100%;max-width:560px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}

.mh{display:flex;align-items:center;gap:10px;margin-bottom:14px}

.plist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}

.plist li.cur{border-color:var(--c-sel)}
.plist .pinfo{flex:1;min-width:0}

/* ---------- 대지(인쇄물) ---------- */
.page .sec{position:relative;background:var(--sbg);color:var(--ink);--sbg:#fff;--ink:#111;--sub:#4a4a4a;--line:#111;--acc:#ffc200;--chip-fg:#111}

.t-hero{height:521px}

.t-intro{padding:58px 0 25px}

.t-table{padding:28px 80px 88px}

.t-grid{padding:28px 60px 72px}
.t-grid.full{padding-left:20px;padding-right:20px}

.ap-label{font:500 22px/1 'Pretendard',sans-serif;color:var(--sub)}

/* ---------------- 칸 표: 칸 범위 · 합치기 · 줄/열 ---------------- */
// 칸 하나는 {t, bg, color, b, size, al, va, rs, cs}. 합쳐져 가려진 칸은 {t:'', m:true}.
const normRect = (a, b) => ({r0: Math.min(a.r, b.r), r1: Math.max(a.r, b.r), c0: Math.min(a.c, b.c), c1: Math.max(a.c, b.c)});
function anchorOf(rows, r, c) {
  for (let rr = r; rr >= 0; rr--) for (let cc = c; cc >= 0; cc--) {
    const x = rows[rr][cc];
    if (!x.m && rr + (x.rs || 1) > r && cc + (x.cs || 1) > c) return [rr, cc];
  }
  return [r, c];
}
function expandRect(rows, R) {
  let {r0, r1, c0, c1} = R, grew = true;
  while (grew) {
    grew = false;
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      const [ar, ac] = anchorOf(rows, r, c), x = rows[ar][ac];

      if (ar < r0) { r0 = ar; grew = true; } if (ac < c0) { c0 = ac; grew = true; }

    }
  }
  return {r0, r1, c0, c1};
}
const CELL_KEYS = ['size', 'b', 'color', 'al', 'va', 'font'];
const cellCSS = x => `${x.bg ? `background:${x.bg};` : ''}${x.color ? `color:${x.color};` : ''}${x.b ? 'font-weight:700;' : ''}${x.size ? `font-size:${x.size}px;` : ''}${x.al ? `text-align:${x.al};` : ''}${x.va ? `vertical-align:${x.va};` : ''}${x.font === 'serif' ? "font-family:'ChosunNm',serif;" : ''}`;
function forCells(d, R, fn) { for (let r = R.r0; r <= R.r1; r++) for (let c = R.c0; c <= R.c1; c++) { const x = d.rows[r][c]; if (!x.m) fn(x, r, c); } }
const cellStyle = x => { const {t, rs, cs, m, ...st} = x; return clone(st); };
function gMerge(d, R) {
  const a = d.rows[R.r0][R.c0], texts = [];

const styleKey = p => p.replace(/\.\d+(?=\.|$)/g, '.*');
const findSec = id => S.post.doc.sections.find(s => s.id === id);
const secBg = s => s.bg || TYPES[s.type].bg;

/* ---------------- 렌더링 ---------------- */
function styleCSS(o) {
  if (!o) return '';
  let c = '';
  if (o.size) c += `font-size:${o.size}px;`;
  if (o.weight) c += `font-weight:${o.weight};`;
  if (o.font) c += `font-family:${o.font === 'serif' ? "'ChosunNm',serif" : "'Pretendard',sans-serif"};`;
  if (o.color) c += `color:${o.color};`;
  if (o.align) c += `text-align:${o.align};`;
  if (o.lh) c += `line-height:${o.lh};`;
  return c;
}
function imgURL(src) {
  if (!src) return '';
  if (src.startsWith('file:')) return src.slice(5);
  if (src.startsWith('asset:')) return '/_blob/' + src.slice(6);
  if (src.startsWith('dbimg:')) return S.dbimg[src.slice(6)] || '';
  return src;
}
function R(sec, E) {
  const field = (path, cls = '', ph = '내용 입력', single = false) => {
    const v = getP(sec.d, path) ?? '';
    if (!E && !String(v).trim()) return '';
    const ed = E ? ` contenteditable="${PT ? 'plaintext-only' : 'true'}" spellcheck="false"` : '';
    return `<div class="f ${cls}" data-f="${path}" data-ph="${esc(ph)}"${single ? ' data-single' : ''}${ed} style="${styleCSS(sec.st[styleKey(path)])}">${esc(v)}</div>`;
  };
  const img = (path, cls = '', ph = '사진 넣기') => {
    const im = getP(sec.d, path) || {};
    const url = imgURL(im.src);
    const fit = im.fit === 'contain' ? ' fit-contain' : '';
    let inner = '';
    if (im.src) {
      const st = `object-position:${im.px ?? 50}% ${im.py ?? 50}%;transform:scale(${im.zoom || 1});transform-origin:${im.px ?? 50}% ${im.py ?? 50}%`;
      const db = im.src.startsWith('dbimg:') ? ` data-dbimg="${im.src.slice(6)}"` : '';
      inner = `<img alt="" draggable="false"${db} src="${esc(url)}" style="${st}">`;
    } else if (E) inner = `<span class="ph">${ph}<br>클릭해서 넣기</span>`;
    return `<div class="img-slot ${cls}${fit}${im.src ? '' : ' empty'}" data-img="${path}">${inner}</div>`;
  };
  const d = sec.d;
  switch (sec.type) {
    case 'hero': return `
      <div class="hero-left">${img('logo', 'hero-logo logo', '로고')}
        <div class="hero-copy">${E || d.eyebrow ? `<div class="eyebrow"><i class="dia"></i>${field('eyebrow', '', 'RECRUIT', true)}</div>` : ''}
        ${field('title', 'hero-title', '제목')}</div></div>
      <div class="hero-grid">${d.photos.map((_, i) => img('photos.' + i)).join('')}</div>`;
    case 'intro': return `${field('headline', 'intro-head serif', '인사 문구', true)}
      <div class="intro-row"><div class="intro-logo">${img('logo', 'logo', '로고')}</div><div class="intro-rule"></div>${field('body', 'intro-body serif', '소개 글')}</div>`;
    case 'pill': return `<div class="pill-wrap"><div class="pill v-${d.variant || 'line'}">${field('text', 'pill-text', '제목', true)}</div></div>`;
    case 'jobs': {
      const n = d.perRow || Math.min(Math.max(d.items.length, 1), 3);
      return `<div class="jobs" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${d.items.map((_, i) => `
        <div class="job"><div class="job-top">${field(`items.${i}.name`, 'job-name', '직무 이름', true)}${field(`items.${i}.count`, 'job-count', '인원', true)}</div>
        ${field(`items.${i}.desc`, 'job-desc', '하는 일')}</div>`).join('')}</div>`;
    }
    case 'table': return `<div class="tbl">${d.rows.map((_, i) => `
      <div class="tr"><div class="th"><i class="dia"></i>${field(`rows.${i}.k`, '', '항목', true)}</div>${field(`rows.${i}.v`, 'td', '내용')}</div>`).join('')}</div>`;
    case 'badges': {
      // 한 줄 개수를 정하면 안쪽 폭 840px에 맞춰 동그라미 지름을 정하고, 줄 폭을 그 개수만큼으로 묶는다
      const per = d.perRow || 0, D = per ? Math.floor(Math.min(220, (840 - (per - 1) * 22) / per)) : 186;
      const wrap = per ? `max-width:${per * D + (per - 1) * 22}px;margin:0 auto;` : '';
      return `${field('title', 'badges-title serif', '제목 (비워두면 숨겨져요)', true)}
      <div class="badges" style="--D:${D}px;${wrap}">${d.items.map((_, i) => `<div class="badge">${field('items.' + i, '', '장점')}</div>`).join('')}</div>`;
    }
    case 'text': return `${field('title', 'tx-title serif', '작은 제목')}${field('body', 'tx-body', '설명 글')}`;
    case 'photo': {
      const n = d.n || 1;
      return `<div class="photos" style="grid-template-columns:repeat(${n},minmax(0,1fr));--ar:${d.ratio || '4/3'}">${d.photos.slice(0, n).map((_, i) => img('photos.' + i)).join('')}</div>
        ${field('caption', 'cap', '사진 설명 (비워두면 숨겨져요)')}`;
    }
    case 'apply': return `${E || d.eyebrow ? `<div class="eyebrow"><i class="dia"></i>${field('eyebrow', '', 'HOW TO APPLY', true)}</div>` : ''}
      ${field('title', 'ap-title', '제목', true)}${field('body', 'ap-body', '안내 글')}
      <div class="ap-contact">${field('label', 'ap-label', '담당', true)}${field('phone', 'ap-phone', '전화번호', true)}</div>
      ${field('address', 'ap-addr', '주소')}<div class="ap-logo">${img('logo', 'logo', '로고')}</div>`;
    case 'spacer': return '';
    case 'grid': {
      const td = (x, r, c) => {
        if (x.m) return '';
        return `<td data-r="${r}" data-c="${c}"${(x.rs || 1) > 1 ? ` rowspan="${x.rs}"` : ''}${(x.cs || 1) > 1 ? ` colspan="${x.cs}"` : ''} style="${cellCSS(x)}">${field(`rows.${r}.${c}.t`, 'gcell', '')}</td>`;
      };
      let cum = 0;
      const handles = E ? d.cols.slice(0, -1).map((w, i) => { cum += w; return `<div class="colrs" data-i="${i}" style="left:${cum}%" title="끌어서 열 너비 조절"></div>`; }).join('') : '';
      return `<div class="gt-wrap"><table class="gt" style="--bw:${d.bw}px;--bc:${d.bc};--cp:${d.pad}px;font-size:${d.fs}px">
        <colgroup>${d.cols.map(w => `<col style="width:${w}%">`).join('')}</colgroup>
        <tbody>${d.rows.map((row, r) => `<tr style="height:${d.rh[r]}px">${row.map((x, c) => td(x, r, c)).join('')}</tr>`).join('')}</tbody></table>${handles}</div>`;
    }
    case 'steps': {
      // 단계 수에 맞춰 동그라미 지름을 정한다 (안쪽 폭 910px, 연결선 최소 48px)
      const n = d.items.length, D = Math.round(Math.min(170, (910 - (n - 1) * 48) / n));
      return `<div class="steps v-${d.variant || 'line'}" style="--D:${D}px">${d.items.map((_, i) => `${i ? '<div class="step-line"></div>' : ''}
        <div class="step${i === n - 1 ? ' last' : ''}"><div class="step-c">${field(`items.${i}.name`, 'step-name', '단계')}</div>${field(`items.${i}.desc`, 'step-desc', '설명 (비워두면 숨겨져요)')}</div>`).join('')}</div>`;
    }
  }
  return '';
}
function freeHTML(sec, E) {
  if (!sec.free.length) return '';
  return `<div class="free-layer">${sec.free.map(it => {
    const pos = `left:${it.x}px;top:${it.y}px;width:${it.w}px;${it.kind === 'image' ? `height:${it.h}px;` : ''}`;
    const tools = E ? `<span class="grip">⠿ 끌어서 이동</span><span class="handle"></span>` : '';
    if (it.kind === 'image') {
      const url = imgURL(it.src); const db = it.src?.startsWith('dbimg:') ? ` data-dbimg="${it.src.slice(6)}"` : '';
      return `<div class="free-item img" data-free="${it.id}" style="${pos}"><div class="img-slot" style="border-radius:${it.radius || 0}px;background:transparent"><img alt="" draggable="false"${db} src="${esc(url)}"></div>${tools}</div>`;
    }
    return `<div class="free-item txt" data-free="${it.id}" style="${pos}"><div class="ft" data-ph="글자 입력" style="${styleCSS(it.style)}">${esc(it.text)}</div>${tools}</div>`;
  }).join('')}</div>`;
}
function secHTML(sec, i, E) {
  const pad = sec.type === 'hero' ? '' : `${sec.pt != null ? `padding-top:${sec.pt}px;` : ''}${sec.pb != null ? `padding-bottom:${sec.pb}px;` : ''}`;
  const extra = sec.type === 'spacer' ? `height:${sec.d.h}px;` : '';
  const cls = (sec.type === 'photo' || sec.type === 'grid') && sec.d.full ? ' full' : '';
  const chrome = E ? `<div class="sec-tag">${TYPES[sec.type].name}</div>
    <div class="sec-tools"><button type="button" data-tool="up" title="위로">↑</button><button type="button" data-tool="down" title="아래로">↓</button><button type="button" data-tool="dup">복제</button><button type="button" class="del" data-tool="del">삭제</button></div>
    <button type="button" class="add-btn" data-add="${i + 1}">＋ 여기에 섹션 추가</button>` : '';
  return `<section class="sec t-${sec.type} bg-${secBg(sec)}${cls}" data-sid="${sec.id}" style="${pad}${extra}">${R(sec, E)}${freeHTML(sec, E)}${chrome}</section>`;
}

function renderPage() {
  const page = $('#page');
  const E = !S.readOnly;
  page.classList.toggle('edit', E);
  const secs = S.post.doc.sections;
  page.innerHTML = secs.length ? secs.map((s, i) => secHTML(s, i, E)).join('')
    : `<div class="page-empty">섹션이 없어요.<br>아래 ‘맨 아래에 섹션 추가’를 눌러 시작하세요.</div>`;
  $('#addEnd').hidden = !E;
  hydrateImages(page);
  fitFree(page);
  applySel(false);
  fitStage();
}
function fitFree(root) {
  $$('.sec', root).forEach(el => {
    el.style.minHeight = '';
    const items = $$('.free-item', el);
    if (!items.length) return;
    const bottom = Math.max(...items.map(it => it.offsetTop + it.offsetHeight));
    if (bottom + 20 > el.offsetHeight) el.style.minHeight = (bottom + 20) + 'px';
  });
}
function hydrateImages(root) {
  return Promise.all($$('img[data-dbimg]', root).map(async im => {
    const id = im.dataset.dbimg;
    if (!S.dbimg[id] && S.db) {
      try { const d = await S.db.doc('images/' + id).get(); if (d.exists) S.dbimg[id] = d.data().data; } catch (e) {}
    }
    if (S.dbimg[id] && im.src !== S.dbimg[id]) im.src = S.dbimg[id];
  }));
}
function fitStage() {
  const stage = $('#stage'), wrap = $('#pagewrap'), page = $('#page');
  const cs = getComputedStyle(stage);
  const avail = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  S.scale = Math.min(1, avail / 1000);
  page.style.transform = `scale(${S.scale})`;
  page.style.setProperty('--inv', (1 / S.scale).toFixed(3));
  wrap.style.width = (1000 * S.scale) + 'px';
  wrap.style.height = (page.offsetHeight * S.scale) + 'px';
}
new ResizeObserver(() => fitStage()).observe($('#stage'));
new ResizeObserver(() => fitStage()).observe($('#page'));

/* ---------------- 선택 ---------------- */
function select(sel) { S.sel = sel; applySel(true); }
function applySel(panel = true) {
  const page = $('#page');
  $$('.is-sel,.is-cur,.csel', page).forEach(el => el.classList.remove('is-sel', 'is-cur', 'csel'));
  $$('.ft[contenteditable]', page).forEach(el => el.removeAttribute('contenteditable'));
  const s = S.sel;
  if (s && !findSec(s.sid)) S.sel = null;
  if (S.sel) {
    const secEl = page.querySelector(`.sec[data-sid="${s.sid}"]`);
    if (secEl) {
      secEl.classList.add('is-cur');
      if (s.kind === 'sec') secEl.classList.add('is-sel');
      if (s.kind === 'field') secEl.querySelector(`.f[data-f="${s.path}"]`)?.classList.add('is-sel');
      if (s.kind === 'img') secEl.querySelector(`.img-slot[data-img="${s.path}"]`)?.classList.add('is-sel');
      if (s.kind === 'cells') $$('.gt td', secEl).forEach(td => { const r = +td.dataset.r, c = +td.dataset.c; if (r >= s.r0 && r <= s.r1 && c >= s.c0 && c <= s.c1) td.classList.add('csel'); });
      if (s.kind === 'free') {
        const it = secEl.querySelector(`.free-item[data-free="${s.fid}"]`);
        if (it) { it.classList.add('is-sel'); const ft = it.querySelector('.ft'); if (ft && !S.readOnly) { ft.setAttribute('contenteditable', PT ? 'plaintext-only' : 'true'); ft.spellcheck = false; } }
      }
    }
  }
  if (panel) renderPanel();
}

/* ---------------- 기록 / 되돌리기 ---------------- */
const snap = () => JSON.stringify({title: S.post.title, doc: S.post.doc});
function pushHist(s = snap()) { S.hist.push(s); if (S.hist.length > 80) S.hist.shift(); S.fut = []; updUndo(); }
function updUndo() { $('#btnUndo').disabled = !S.hist.length || S.readOnly; $('#btnRedo').disabled = !S.fut.length || S.readOnly; }
function restore(str) { const o = JSON.parse(str); S.post.title = o.title; S.post.doc = o.doc; $('#postTitle').value = o.title || ''; renderPage(); renderPanel(); changed(); updUndo(); }
function undo() { if (!S.hist.length || S.readOnly) return; document.activeElement?.blur?.(); S.fut.push(snap()); restore(S.hist.pop()); }
function redo() { if (!S.fut.length || S.readOnly) return; document.activeElement?.blur?.(); S.hist.push(snap()); restore(S.fut.pop()); }
function commit(fn, {page = true, panel = true} = {}) {
  if (S.readOnly) return;
  pushHist(); fn(); changed();
  if (page) renderPage(); if (panel) renderPanel();
}

/* ---------------- 저장 ---------------- */
function setSave(t, err = false) { const el = $('#saveState'); el.textContent = t; el.classList.toggle('err', err); }
function changed() { if (S.readOnly) return; S.touched = true; setSave('저장 대기…'); clearTimeout(S.saveT); S.saveT = setTimeout(saveNow, 900); }
const hm = t => new Date(t).toLocaleTimeString('ko-KR', {hour: 'numeric', minute: '2-digit'});
async function saveNow() {
  clearTimeout(S.saveT); S.saveT = null;
  if (S.readOnly) return;
  if (S.saving) { S.again = true; return; }
  S.saving = true; setSave('저장 중…');
  try { await persist(); setSave(S.db ? `저장됨 · ${hm(Date.now())}` : `이 브라우저에 저장됨 · ${hm(Date.now())}`); }
  catch (e) { setSave(saveErrText(e), true); }
  S.saving = false;
  if (S.again) { S.again = false; saveNow(); }
}
function saveErrText(e) {
  const c = e?.code;
  if (c === 'invalid_argument') return '저장 실패: 편집 권한이 없거나 내용이 너무 커요';
  if (c === 'quota_exceeded') return '저장 공간이 가득 찼어요. 안 쓰는 공고를 지워주세요';
  if (c === 'resource_exhausted') return '잠시 후 다시 저장할게요';
  return '저장 실패: 잠시 후 다시 시도해주세요';
}
async function persist() {
  const now = Date.now();
  const body = {title: (S.post.title || '').trim() || '제목 없는 공고', doc: S.post.doc, createdAt: S.post.createdAt || now, updatedAt: now, updatedBy: S.uid || null};
  if (!S.db) { try { localStorage.setItem(LS_KEY, JSON.stringify(body)); } catch (e) { throw {code: 'local'}; } return; }
  if (!S.postId) {
    S.postId = uid(); S.post.createdAt = now;
    await takeLock(S.postId);
  }
  await S.db.doc('posts/' + S.postId).set(body);
  S.post.updatedAt = now;
}
async function takeLock(id) {
  clearInterval(S.lockTimer); S.lockTimer = null;
  if (!S.db || !S.holder) return true;
  const ref = S.db.doc('locks/' + id);
  try {
    const r = await ref.acquire({holder: S.holder, ttlMs: 60000});
    if (!r.acquired) return false;
    S.lockTimer = setInterval(async () => {
      if (S.postId !== id) return;
      try { const r2 = await ref.acquire({holder: S.holder, ttlMs: 60000}); if (!r2.acquired) setReadOnly('lock'); } catch (e) {}
    }, 25000);
    return true;
  } catch (e) { return true; }
}

/* ---------------- 공고 열기 / 만들기 ---------------- */
async function flush() { if (S.saveT || S.saving) { await saveNow(); } }
function loadPost(id, data) {
  S.postId = id; S.post = clone({title: data.title, doc: data.doc, createdAt: data.createdAt, updatedAt: data.updatedAt});
  S.hist = []; S.fut = []; S.sel = null;
  $('#postTitle').value = S.post.title || '';
  updUndo();
}
// Claude 저장소는 목록에 본문까지 오지만, 공용 저장소(Supabase)는 목록이 가벼워서 본문을 따로 받아온다.
async function fullPost(id) {
  const p = S.posts.find(x => x.id === id); if (!p) return null;
  if (p.doc) return p;
  try { const f = await S.db.doc('posts/' + id).get(); return f.exists ? {...p, ...f.data()} : null; } catch (e) { return null; }
}
async function openPost(id) {
  await flush();
  const p = await fullPost(id); if (!p) { toast('공고를 불러오지 못했어요. 잠시 후 다시 열어주세요'); return; }
  loadPost(id, p);
  const ok = S.noWrite ? false : await takeLock(id);
  setReadOnly(S.noWrite ? 'perm' : ok ? null : 'lock');
  setSave(p.updatedAt ? `마지막 수정 ${relTime(p.updatedAt)}${nameOf(p.updatedBy) ? ' · ' + nameOf(p.updatedBy) : ''}` : '');
  renderPage(); renderPanel();
}
async function newPost(data = newPostData(), {save = false} = {}) {
  await flush();
  clearInterval(S.lockTimer); S.lockTimer = null;
  S.postId = null; S.post = clone(data); S.hist = []; S.fut = []; S.sel = null;
  $('#postTitle').value = S.post.title;
  setReadOnly(S.noWrite ? 'perm' : null);
  setSave(S.noWrite ? '' : '새 공고 · 수정하면 자동 저장돼요');
  renderPage(); renderPanel(); updUndo();
  if (save && !S.noWrite) await saveNow();
}
function setReadOnly(reason) {
  S.readOnly = !!reason;
  const b = $('#banner');
  if (reason === 'lock') {
    b.hidden = false;
    b.innerHTML = `<span>${S.lockName ? esc(S.lockName) + '님이' : '다른 직원이'} 이 공고를 편집하고 있어서 지금은 보기만 할 수 있어요. 1분쯤 뒤에 다시 열거나 복사본을 만들어 편집하세요.</span><button class="btn sm" data-bact="copy" type="button">복사본 만들어 편집</button><button class="btn sm" data-bact="retry" type="button">다시 시도</button>`;
  } else if (reason === 'perm') {
    b.hidden = false; b.innerHTML = `<span>보기 전용이에요. 편집하려면 이 페이지 주인에게 ‘기여자’ 이상 권한을 요청하세요. PNG 저장은 할 수 있어요.</span>`;
  } else if (S.localMode) {
    b.hidden = false; b.innerHTML = `<span>${S.localMode}</span>`;
  } else b.hidden = true;
  updUndo();
  $('#postTitle').readOnly = S.readOnly;
}
$('#banner').addEventListener('click', async e => {
  const a = e.target.closest('[data-bact]')?.dataset.bact;
  if (a === 'copy') { const d = {title: (S.post.title || '') + ' 복사본', doc: clone(S.post.doc)}; await newPost(d, {save: true}); toast('복사본을 만들었어요'); }
  if (a === 'retry' && S.postId) openPost(S.postId);
});

/* ---------------- 이름 · 시간 ---------------- */
function nameOf(id) { return id ? (S.names[id] || '') : ''; }
async function resolveNames() {
  if (!S.user?.profiles) return;
  const ids = [...new Set(S.posts.map(p => p.updatedBy).filter(Boolean))];
  if (!ids.length) return;
  try { const ps = await S.user.profiles(ids); ids.forEach(id => { S.names[id] = ps[id]?.name || ''; }); if (!$('#modal').hidden && S.modal === 'list') renderList(); } catch (e) {}
}
function relTime(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  return new Date(t).toLocaleDateString('ko-KR', {month: 'long', day: 'numeric'});
}

/* ---------------- 대지 이벤트 ---------------- */
const page = $('#page');
function ctx(el) {
  const secEl = el.closest('.sec'); if (!secEl) return {};
  return {secEl, sec: findSec(secEl.dataset.sid)};
}
page.addEventListener('click', e => {
  if (S.readOnly) return;
  const tool = e.target.closest('[data-tool]');
  if (tool) { const {sec} = ctx(tool); secAction(tool.dataset.tool, sec.id); return; }
  const add = e.target.closest('[data-add]');
  if (add) { openPicker(+add.dataset.add); return; }
  if (e.target.closest('.free-item')) return;
  if (S.justDragged || e.target.closest('.colrs')) return;
  const gtd = e.target.closest('.gt td');
  if (gtd) {

function setVal(k, raw, live) {

  const v = num(raw);
  const apply = () => {
    if (k === 'sec.bg') sec.bg = v;
    else if (k === 'sec.pt') sec.pt = v;
    else if (k === 'sec.pb') sec.pb = v;
    else if (k.startsWith('sec.d.')) sec.d[k.slice(6)] = v;
    else if (k.startsWith('txt.')) { const t = txtTarget(); const p = k.slice(4); if (p === 'size') { const n = parseFloat(raw); if (!(n > 0)) return; t.size = Math.min(300, n); } else t[p] = v; }
    else if (k.startsWith('img.')) { const im = getP(sec.d, S.sel.path); im[k.slice(4)] = v; }
    else if (k.startsWith('free.')) { const it = curFree(); it[k.slice(5)] = v; if (k === 'free.w' && it.kind === 'image') { it.h = Math.round(it.h * v / (it.wPrev || it.w)); } }
    else if (k.startsWith('cell.')) {
      const p = k.slice(5); let val = v;

      forCells(sec.d, S.sel, x => { if (val === '' || val === false || val == null) delete x[p]; else x[p] = val; });
    }

  if (live) {
    if (!S.sliderSnap) { pushHist(); S.sliderSnap = true; }

async function fontEmbed() {
  if (S.fontCSS) return S.fontCSS;
  const faces = [['Pretendard', 400, 'Pretendard-Regular'], ['Pretendard', 500, 'Pretendard-Medium'], ['Pretendard', 700, 'Pretendard-Bold'], ['Pretendard', 800, 'Pretendard-ExtraBold'], ['ChosunNm', 400, 'ChosunNm']];
  const parts = await Promise.all(faces.map(async ([fam, w, file]) => {
    const blob = await (await fetch(`fonts/${file}.woff2`)).blob();
    const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
    return `@font-face{font-family:'${fam}';font-weight:${w};src:url(${url}) format('woff2')}`;
  }));
  return (S.fontCSS = parts.join('\n'));
}
async function buildExportNode() {
  const root = $('#exportRoot');
  root.innerHTML = `<div class="page">${S.post.doc.sections.map((s, i) => secHTML(s, i, false)).join('')}</div>`;
  await hydrateImages(root);
  await Promise.all($$('img', root).map(im => im.decode().catch(() => {})));
  await document.fonts.ready;
  const node = root.firstElementChild;
  fitFree(root);
  return node;
}
function cutPoints(node, maxH) {
  const H = node.offsetHeight; const tops = $$(':scope > .sec', node).map(s => s.offsetTop);
  const cuts = [0]; let start = 0;
  while (H - start > maxH) {
    const cand = tops.filter(t => t > start && t - start <= maxH);
    const next = cand.length ? Math.max(...cand) : start + maxH;
    cuts.push(next); start = next;
  }
  cuts.push(H);
  return cuts;
}
const canvasBlob = c => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('이미지를 만들지 못했어요')), 'image/png'));
async function runExport() {
  const btn = $('#doExport'), prog = $('#prog'), out = $('#expOut');
  btn.disabled = true; out.innerHTML = '';
  try {
    if (!window.htmlToImage) throw new Error('이미지 도구를 불러오지 못했어요. 새로고침 후 다시 시도하세요');
    prog.textContent = '글꼴과 사진을 준비하는 중…';
    const css = await fontEmbed();
    const node = await buildExportNode();
    const H = node.offsetHeight;
    // 브라우저가 만들 수 있는 이미지 크기에 한계가 있어서, 너무 크면 배수를 낮춰 다시 그린다.
    let ratio = EXP.ratio, canvas = null;
    while (ratio > 1 && (H * ratio > 32000 || 1000 * ratio * H * ratio > 120e6)) ratio--;
    for (; ratio >= 1; ratio--) {
      prog.textContent = `이미지를 그리는 중… (${ratio}배)`;
      try {
        canvas = await htmlToImage.toCanvas(node, {width: 1000, height: H, pixelRatio: ratio, fontEmbedCSS: css, backgroundColor: '#ffffff', skipAutoScale: true, cacheBust: false});
        await canvasBlob(canvas); break;
      } catch (er) { canvas = null; if (ratio === 1) throw er; }
    }
    const lowered = ratio < EXP.ratio;
    const base = ((S.post.title || '채용공고').trim() || '채용공고').replace(/[\\/:*?"<>|]+/g, ' ').slice(0, 80);
    let files = [];
    if (!EXP.split || H <= EXP.split) files = [{name: base + '.png', blob: await canvasBlob(canvas)}];
    else {
      const cuts = cutPoints(node, EXP.split);
      for (let i = 0; i < cuts.length - 1; i++) {
        const y = cuts[i] * ratio, h = (cuts[i + 1] - cuts[i]) * ratio;
        const c = document.createElement('canvas'); c.width = canvas.width; c.height = h;
        c.getContext('2d').drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
        files.push({name: `${base}_${String(i + 1).padStart(2, '0')}.png`, blob: await canvasBlob(c)});
      }
    }
    $('#exportRoot').innerHTML = '';
    out.innerHTML = `<div class="preview-imgs">${files.map(f => `<img alt="${esc(f.name)}" src="${URL.createObjectURL(f.blob)}">`).join('')}</div>`;
    let saveName, saveData;
    if (files.length === 1) { saveName = files[0].name; saveData = files[0].blob; }
    else {
      prog.textContent = 'ZIP으로 묶는 중…';
      const zip = new JSZip(); files.forEach(f => zip.file(f.name, f.blob));
      saveName = base + '.zip'; saveData = await zip.generateAsync({type: 'blob'});
    }
    prog.textContent = '';
    if (S.downloads) {
      try { await S.downloads.save({filename: saveName, data: saveData}); prog.textContent = files.length > 1 ? `${files.length}장을 ZIP으로 저장했어요` : '저장했어요'; }
      catch (er) {
        if (er?.code === 'declined') prog.textContent = '저장을 취소했어요';
        else prog.textContent = '여기서는 바로 저장할 수 없어요. 아래 이미지를 길게 누르거나 우클릭해서 저장하세요';
      }
    } else if (!window.claude?.use) {
      // 일반 웹사이트로 열었을 때는 바로 내려받는다
      const a = document.createElement('a'); a.href = URL.createObjectURL(saveData); a.download = saveName;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
      prog.textContent = files.length > 1 ? `${files.length}장을 ZIP으로 저장했어요` : '저장했어요 · 다운로드 폴더를 확인하세요';
    } else prog.textContent = '아래 이미지를 우클릭(휴대폰은 길게 누르기)해서 저장하세요';
    if (lowered) prog.textContent += ` · 공고가 길어서 ${ratio}배로 저장했어요`;
  } catch (er) {
    console.error(er); prog.textContent = er?.message || 'PNG를 만들지 못했어요';
  }
  btn.disabled = false;
}

  setReadOnly(null); renderPage(); renderPanel();
}
/* ---------------- 공용 저장소 (Claude 없이 쓰는 웹사이트용, Supabase) ---------------- */
// 매장 비밀번호를 확인하는 함수(RPC)로만 읽고 쓴다. 나머지 코드가 그대로 쓰도록 Claude db와 같은 모양으로 감싼다.
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
async function cloudRpc(fn, args = {}, pin = S.pin) {
  let r;
  try {
    r = await fetch(`${S.cloud.url}/rest/v1/rpc/${fn}`, {method: 'POST',
      // 예전 방식 공개키(eyJ…)는 Authorization 에도 넣고, 새 방식(sb_publishable_…)은 apikey 에만 넣는다
      headers: {apikey: S.cloud.key, ...(S.cloud.key.startsWith('eyJ') ? {Authorization: 'Bearer ' + S.cloud.key} : {}), 'Content-Type': 'application/json'},
      body: JSON.stringify({p_pin: pin, ...args})});
  } catch (e) { throw {code: 'unavailable', message: '인터넷 연결을 확인해주세요'}; }
  const txt = await r.text();
  if (!r.ok) {
    if (/wrong_pin/.test(txt)) { lsSet('hesed.pin', ''); S.pin = ''; setTimeout(() => askLogin(false, '매장 비밀번호가 바뀌었어요. 새 비밀번호를 입력하세요'), 0); throw {code: 'wrong_pin'}; }
    throw {code: r.status === 413 ? 'invalid_argument' : 'unavailable', message: txt};
  }
  return txt ? JSON.parse(txt) : null;
}
function cloudDB() {
  const listeners = [];
  const snapDoc = (id, data) => ({id, exists: !!data, data: () => data || undefined});
  const poll = async () => {
    if (!S.pin) return;
    try {
      const rows = await cloudRpc('list_posts');
      const docs = rows.map(p => snapDoc(p.id, {title: p.title, createdAt: p.createdAt, updatedAt: p.updatedAt, updatedBy: p.updatedBy}));
      listeners.forEach(l => l.next({docs, size: docs.length, empty: !docs.length}));
    } catch (e) { if (e.code !== 'wrong_pin') listeners.forEach(l => l.err?.(e)); }
  };
  setInterval(() => { if (document.visibilityState === 'visible') poll(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });
  return {
    poll,
    doc(path) {
      const [col, id] = path.split('/');
      return {
        async get() {
          if (col === 'posts') return snapDoc(id, await cloudRpc('get_post', {p_id: id}));
          if (col === 'images') { const d = await cloudRpc('get_image', {p_id: id}); return snapDoc(id, d ? {data: d} : null); }
        },
        async set(b) {
          if (col === 'posts') { await cloudRpc('save_post', {p_id: id, p_title: b.title, p_doc: b.doc, p_by: b.updatedBy, p_created: b.createdAt, p_updated: b.updatedAt}); poll(); }
          if (col === 'images') await cloudRpc('put_image', {p_id: id, p_data: b.data});
        },
        async delete() { await cloudRpc('delete_post', {p_id: id}); poll(); },
        async acquire({holder, ttlMs}) {
          const r = await cloudRpc('acquire_lock', {p_post: id, p_holder: holder, p_name: S.myName || '', p_ttl: Math.round(ttlMs / 1000)});
          S.lockName = r.acquired ? '' : (r.name || '');
          return r;
        },
      };
    },
    collection() { const q = {orderBy: () => q, limit: () => q, onSnapshot(next, err) { listeners.push({next, err}); poll(); return () => {}; }}; return q; },
  };
}
function askLogin(renameOnly = false, notice = '') {
  return new Promise(resolve => {
    openModal(`<div class="mcard" role="dialog" aria-label="시작하기"><div class="mh"><h2>${renameOnly ? '이름 바꾸기' : '헤세드 채용공고 편집기'}</h2>${renameOnly ? '<button class="btn sm" type="button" id="lgCancel">취소</button>' : ''}</div>
      ${notice ? `<p class="hint" style="color:var(--c-danger)">${esc(notice)}</p>` : `<p class="hint">${renameOnly ? '공고 목록에 마지막으로 고친 사람으로 표시돼요.' : '직원들과 함께 쓰는 편집기예요. 처음 한 번만 입력하면 이 기기에 기억돼요.'}</p>`}
      <form id="lgForm" class="opt" style="margin-top:14px">
        ${renameOnly ? '' : `<label class="row"><span class="lab">매장 비밀번호</span><input id="lgPin" type="password" autocomplete="current-password" style="flex:1;min-width:0;border:1px solid var(--c-line);border-radius:9px;padding:9px 10px;background:var(--c-panel)" required></label>`}
        <label class="row"><span class="lab">내 이름</span><input id="lgName" value="${esc(S.myName || '')}" maxlength="20" placeholder="예: 김민수" style="flex:1;min-width:0;border:1px solid var(--c-line);border-radius:9px;padding:9px 10px;background:var(--c-panel)" required></label>
        <div class="row"><button class="btn primary" type="submit" id="lgGo">${renameOnly ? '저장' : '시작하기'}</button><span class="prog" id="lgMsg"></span></div>
      </form></div>`, 'login');
    $('#lgCancel')?.addEventListener('click', () => { closeModalForce(); resolve(false); });
    $('#lgForm').addEventListener('submit', async e => {
      e.preventDefault();
      const name = $('#lgName').value.trim(); if (!name) return;
      if (renameOnly) { S.myName = name; S.uid = name; lsSet('hesed.name', name); closeModalForce(); resolve(true); return; }
      const pin = $('#lgPin').value; $('#lgGo').disabled = true; $('#lgMsg').textContent = '확인하는 중…';
      try {
        const ok = await cloudRpc('check_pin', {}, pin);
        if (!ok) { $('#lgMsg').textContent = '비밀번호가 맞지 않아요'; $('#lgGo').disabled = false; return; }
        S.pin = pin; S.myName = name; S.uid = name; lsSet('hesed.pin', pin); lsSet('hesed.name', name);
        closeModalForce(); resolve(true); S.db?.poll?.();
      } catch (er) { $('#lgMsg').textContent = '연결하지 못했어요. 인터넷을 확인하고 다시 시도하세요'; $('#lgGo').disabled = false; }
    });
    setTimeout(() => (renameOnly ? $('#lgName') : $('#lgPin'))?.focus(), 0);
  });
}
function closeModalForce() { S.modal = null; closeModal(); }
async function bootCloud(cfg) {
  S.cloud = cfg; S.pin = lsGet('hesed.pin'); S.myName = lsGet('hesed.name');
  let device = lsGet('hesed.device'); if (!device) { device = 'd-' + uid(); lsSet('hesed.device', device); }
  setSave('');
  let ok = false;
  if (S.pin && S.myName) { try { ok = await cloudRpc('check_pin', {}, S.pin); } catch (e) { ok = e.code !== 'wrong_pin'; } }
  if (!ok) await askLogin(false);
  S.uid = S.myName; S.holder = device;
  S.user = {profiles: async ids => Object.fromEntries([].concat(ids).map(i => [i, {name: i}]))};
  startShared(cloudDB());
}

async function boot() {
  S.post = newPostData(); $('#postTitle').value = S.post.title;
  renderPage(); renderPanel(); setSave('불러오는 중…');
  const C = window.claude;
  if (!C?.use) {
    if (window.HESED_CLOUD?.url) return bootCloud(window.HESED_CLOUD);
    startLocal('미리보기 모드예요. 작업 내용은 이 브라우저에만 저장돼요.'); setSave(''); return;
  }
  const use = n => C.use(n).catch(() => null);
  const [db, user, assets, downloads] = await Promise.all([use('db'), use('user'), use('assets'), use('downloads')]);
  Object.assign(S, {db, user, assets, downloads});
  if (!db) { startLocal('로그인하지 않아서 직원들과 함께 저장되지 않아요. 작업 내용은 이 브라우저에만 남아요.'); setSave(''); return; }
  try { S.uid = await user?.id?.(); } catch (e) {}
  S.holder = S.uid || ('anon-' + uid());
  try { const can = await user?.can?.('data.write'); if (can === false) S.noWrite = true; } catch (e) {}
  startShared(db);
}
function startShared(db) {
  S.db = db;
  setReadOnly(S.noWrite ? 'perm' : null); renderPage(); renderPanel();
  setSave(S.noWrite ? '' : '새 공고 · 수정하면 자동 저장돼요');
  db.collection('posts').orderBy('updatedAt', 'desc').limit(300).onSnapshot(snapq => {
    S.posts = snapq.docs.map(d => ({id: d.id, ...d.data()}));
    if (!S.gotFirst) {
      S.gotFirst = true;
      if (!S.postId && !S.touched && S.posts.length) openPost(S.posts[0].id);
    } else if (S.postId && S.readOnly) {
      const p = S.posts.find(x => x.id === S.postId);
      if (p && p.updatedAt !== S.post.updatedAt) fullPost(p.id).then(f => { if (f && S.readOnly && S.postId === f.id) { loadPost(f.id, f); renderPage(); } });
    }
    if (S.modal === 'list') renderList();
    resolveNames();
  }, err => { setSave('목록을 불러오지 못했어요. 새로고침해주세요', true); });
}
window.addEventListener('beforeunload', () => { if (S.saveT) saveNow(); });
boot();
})();
</script>
